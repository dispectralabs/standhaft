[package]
name = "standhaft-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sp1-sdk = { version = "6.9.0", features = ["native-gnark"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
hex = "0.4"

[build-dependencies]
sp1-build = "6.9.0"
